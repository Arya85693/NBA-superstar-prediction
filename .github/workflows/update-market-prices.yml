name: Update Market Prices

on:
  workflow_dispatch:
  schedule:
    # Twice per hour at :15 and :45 UTC (avoids :00 UTC, where GitHub warns load can delay/drop schedules).
    # Omit `timezone:` so older GitHub versions still accept the workflow; see events docs for timezone-aware cron.
    - cron: "15,45 * * * *"

permissions:
  contents: read

concurrency:
  group: update-market-prices
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      # Restore last successful raw_game_logs.csv (incremental fetch appends new games only).
      - name: Restore cached raw game logs
        uses: actions/cache/restore@v4
        with:
          path: data/raw_game_logs.csv
          key: bdl-raw-v1-bootstrap
          restore-keys: |
            bdl-raw-v1-

      - name: Fetch NBA data and rebuild Fair Value
        run: python pipeline/run_pipeline.py --fetch-balldontlie --active

      - name: Save raw game logs cache
        if: success()
        run: |
          mkdir -p data
          KEY=$(python -c "from pathlib import Path; import pandas as pd; p=Path('data/raw_game_logs.csv'); print('bootstrap' if not p.is_file() else str(pd.read_csv(p, usecols=['GAME_DATE'])['GAME_DATE'].max())[:10])")
          echo "BDL_RAW_CACHE_KEY=bdl-raw-v1-${KEY}" >> "$GITHUB_ENV"

      - name: Upload raw game logs cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/raw_game_logs.csv
          key: ${{ env.BDL_RAW_CACHE_KEY }}

      - name: Sync Fair Value to Supabase
        run: python pipeline/sync_prices_to_supabase.py

      - name: Update Market Price layer
        run: python pipeline/update_market_state.py
