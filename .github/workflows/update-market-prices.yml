name: Update Market Prices

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes at :07/:22/:37/:52 UTC (avoids :00 UTC, where GitHub warns load can delay/drop schedules).
    # Omit `timezone:` so older GitHub versions still accept the workflow; see events docs for timezone-aware cron.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: update-market-prices
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      # Only used by the deprecated --fetch-balldontlie fallback; ESPN needs no key.
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      # Restore the newest raw_game_logs.csv (incremental fetch re-reads only the last day or two).
      # Cache keys are immutable, so every run saves under its own key and restore picks the newest
      # prefix match. `bdl-raw-v1-` is the BALLDONTLIE-era cache: the first ESPN run restores it so
      # ESPN athletes map onto the player ids the market already uses.
      - name: Restore cached raw game logs
        uses: actions/cache/restore@v4
        with:
          path: data/raw_game_logs.csv
          key: raw-logs-v2-${{ github.run_id }}
          restore-keys: |
            raw-logs-v2-
            bdl-raw-v1-

      - name: Fetch NBA data and rebuild Fair Value
        run: python pipeline/run_pipeline.py --fetch-espn --active

      - name: Upload raw game logs cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/raw_game_logs.csv
          key: raw-logs-v2-${{ github.run_id }}

      # The prices revision is bumped by the market step, together with market_revision,
      # so the site never serves new Fair Value against the previous Market Price.
      - name: Sync Fair Value to Supabase
        run: python pipeline/sync_prices_to_supabase.py --defer-revision-bump

      - name: Update Market Price layer and publish revisions
        run: python pipeline/update_market_state.py
