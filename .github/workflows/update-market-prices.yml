name: Update Market Prices

on:
  workflow_dispatch:
    inputs:
      espn_refetch_from:
        description: "Leave BLANK for a normal run. Only to repair data: a date like 2026-04-12 re-downloads every final since then."
        required: false
        default: ""
  # Primary trigger: Supabase pg_cron calls workflow_dispatch every 15 minutes
  # (supabase/pipeline_dispatch.sql), because GitHub's scheduler is best-effort and in
  # practice fired only every ~7-8 hours. This hourly schedule is just a backup.
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: update-market-prices
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      # Empty on scheduled runs; set from the manual-run input to repair a date range.
      ESPN_REFETCH_FROM: ${{ github.event.inputs.espn_refetch_from || '' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      # Restore the newest raw_game_logs.csv (incremental fetch re-reads only the last day or two).
      # Cache keys are immutable, so every run saves under its own key and restore picks the newest
      # prefix match. `bdl-raw-v1-` (BALLDONTLIE era) is the last resort: it keeps every player id
      # the market already uses, but holds partial in-progress box scores, so the fetch step below
      # re-downloads every final since BALLDONTLIE took over whenever that cache is restored.
      - name: Restore cached raw game logs
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw_game_logs.csv
          key: raw-logs-v2-${{ github.run_id }}
          restore-keys: |
            raw-logs-v2-
            bdl-raw-v1-

      - name: Fetch NBA data and rebuild Fair Value
        env:
          MATCHED_CACHE_KEY: ${{ steps.raw-cache.outputs.cache-matched-key }}
        run: |
          if [[ "$MATCHED_CACHE_KEY" == bdl-raw-v1-* && -z "$ESPN_REFETCH_FROM" ]]; then
            echo "Restored the BALLDONTLIE-era cache ($MATCHED_CACHE_KEY): re-fetching every final since 2026-04-12 to replace partial box scores."
            export ESPN_REFETCH_FROM=2026-04-12
          fi
          python pipeline/run_pipeline.py --fetch-espn --active

      - name: Upload raw game logs cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/raw_game_logs.csv
          key: raw-logs-v2-${{ github.run_id }}

      # The prices revision is bumped by the market step, together with market_revision,
      # so the site never serves new Fair Value against the previous Market Price.
      - name: Sync Fair Value to Supabase
        run: python pipeline/sync_prices_to_supabase.py --defer-revision-bump

      - name: Update Market Price layer and publish revisions
        run: python pipeline/update_market_state.py
